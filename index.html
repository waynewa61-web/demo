/* KaziTasks Messages v2 — scoped to chat screens; other PWA views unchanged */
.kt-chat-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0;max-width:1040px;margin:auto;background:#fff;border:1px solid #edf0f5;border-radius:23px;overflow:hidden;box-shadow:0 14px 40px rgba(16,37,72,.07);min-height:660px;color:#14284c}
.kt-chat-inbox{background:#fff;min-width:0;display:flex;flex-direction:column;border-right:1px solid #edf0f4}
.kt-chat-inbox-head{padding:21px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.kt-chat-inbox-head h1{font-size:26px;letter-spacing:-.9px;line-height:1;margin:0;color:#132746}
.kt-chat-round{width:38px;height:38px;flex:0 0 38px;border:1px solid #ebedf3;background:#f8f9fc;border-radius:12px;color:#172b4d;display:grid;place-items:center;position:relative}
.kt-chat-round.kt-accent{background:#fff2e6;border-color:#ffe3ca;color:#f7781d}
.kt-chat-search{margin:8px 17px 14px;display:flex;align-items:center;gap:9px;background:#f5f6f9;border-radius:14px;padding:0 12px;height:43px;border:1px solid #f1f2f6;color:#8995a9}
.kt-chat-search input{outline:0;border:0;background:transparent;min-width:0;flex:1;font-size:12px;color:#182b4a}
.kt-chat-search input::placeholder{color:#94a0b1}
.kt-chat-stories{display:flex;gap:15px;padding:5px 17px 17px;overflow:auto;scrollbar-width:none}
.kt-chat-story{border:0;background:none;padding:0;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:680;color:#52627b}
.kt-chat-story .kt-chat-avatar{width:53px;height:53px;border:2px solid #ff821e;box-shadow:0 0 0 3px #fff6ee}
.kt-chat-avatar{width:47px;height:47px;flex:0 0 47px;border-radius:50%;position:relative;background:var(--avatar-bg,#ffe4ce);color:var(--avatar-ink,#8b4615);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:850;letter-spacing:-.03em;border:2px solid white;box-shadow:0 0 0 1px #edf0f4}
.kt-chat-avatar.is-online:after{content:'';position:absolute;background:#28b56b;border:2px solid white;width:10px;height:10px;border-radius:50%;right:0;bottom:1px}
.kt-chat-filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:0 17px 14px}
.kt-chat-filter{padding:8px 14px;border:0;background:#f4f5f8;color:#52617a;border-radius:100px;font-size:11px;font-weight:780;white-space:nowrap}
.kt-chat-filter.on{background:#ff781c;color:white}
.kt-chat-list{padding-bottom:15px;flex:1;overflow:auto;max-height:590px;scrollbar-width:thin}
.kt-chat-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;padding:13px 16px;border-top:1px solid #f4f5f8;color:#172948;transition:background .15s}
.kt-chat-item:hover,.kt-chat-item.selected{background:#fff8f1}
.kt-chat-item .kt-chat-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.kt-chat-item .kt-chat-who strong{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt-chat-item .kt-chat-who small{font-size:11px;color:#8390a3;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%}
.kt-chat-item .kt-chat-who small.typing{color:#ff781c;font-weight:760}
.kt-chat-meta{display:flex;flex-direction:column;align-items:flex-end;gap:7px;align-self:center;flex:0 0 auto}
.kt-chat-meta time{font-size:9px;color:#7e8ba0}
.kt-chat-count{background:#ff781c;border-radius:22px;color:white;font-size:10px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;font-weight:800}
.kt-chat-pane{background:#f5f7fb;min-width:0;display:flex;flex-direction:column;position:relative;max-height:min(800px,calc(100dvh - 180px));min-height:620px}
.kt-chat-thread-head{display:flex;align-items:center;gap:9px;padding:12px 15px;background:#fff;border-bottom:1px solid #ebedf4;z-index:2}
.kt-chat-thread-head .kt-chat-avatar{width:42px;height:42px;flex-basis:42px}
.kt-chat-thread-person{flex:1;min-width:0}
.kt-chat-thread-person strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt-chat-thread-person small{font-size:10px;color:#1aab62;display:block;margin-top:3px}
.kt-chat-thread-person small.subdued{color:#8794a6}
.kt-chat-thread-actions{display:flex;gap:5px}
.kt-chat-thread-actions .kt-chat-round{width:35px;height:35px;flex-basis:35px;background:white;border:0}
.kt-chat-mobile-back{display:none}
.kt-chat-scroll{padding:17px 16px 20px;overflow:auto;scroll-behavior:smooth;flex:1;display:flex;flex-direction:column;gap:12px;min-height:200px}
.kt-chat-date{align-self:center;border-radius:100px;padding:6px 11px;background:#e8edf5;color:#788397;font-size:10px;font-weight:800;margin:0 0 7px}
.kt-chat-line{display:flex;gap:8px;align-items:flex-end;max-width:87%;align-self:flex-start}
.kt-chat-line.mine{align-self:flex-end;flex-direction:row-reverse}
.kt-chat-line .kt-chat-avatar{width:27px;height:27px;flex-basis:27px;font-size:10px}
.kt-chat-bubble{border-radius:16px 16px 16px 5px;padding:11px 13px;background:white;color:#1c2d4c;max-width:100%;min-width:88px;box-shadow:0 2px 7px rgba(16,37,71,.025);font-size:12px;line-height:1.53;overflow-wrap:anywhere}
.kt-chat-line.mine .kt-chat-bubble{background:#ffead9;border-radius:16px 16px 5px 16px}
.kt-chat-bubble .kt-chat-sender{font-size:10px;color:#f2781c;font-weight:840;margin-bottom:4px}
.kt-chat-bubble .kt-chat-foot{display:flex;justify-content:flex-end;align-items:center;gap:4px;color:#9aa4b5;font-size:9px;margin-top:6px}
.kt-chat-bubble .kt-chat-foot svg{width:14px;height:14px;color:#ff781c}
.kt-chat-bubble .kt-chat-reactions{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;background:#fff;border:1px solid #edf0f4;border-radius:20px;margin:8px 0 0;font-size:12px}
.kt-chat-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-width:310px;margin-bottom:5px}
.kt-chat-photo{height:120px;min-width:0;display:grid;place-items:center;position:relative;overflow:hidden;border:0;border-radius:12px;background:#e5eef2;color:#568a9c;padding:0}
.kt-chat-photo:nth-child(2){background:#f7e9db;color:#c77c4d}.kt-chat-photo:nth-child(3){background:#eae7fc;color:#7971b2}
.kt-chat-photo .scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,#f5efe7 15%,#d8e2dd 15% 19%,#f3ede6 19% 80%,#fff9f0 80%)}
.kt-chat-photo .scene:before{content:'';position:absolute;width:64%;height:30%;left:18%;bottom:13%;border-radius:12px 12px 4px 4px;background:#b6c5bc;box-shadow:0 14px 0 -10px #657d79,16px -27px 0 -11px #d8bb83}
.kt-chat-photo .scene:after{content:'';position:absolute;width:28px;height:65px;right:10%;top:15%;background:#d3e4d5;border-radius:18px 18px 3px 3px;border:5px solid #edf3ed}
.kt-chat-photo img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.kt-chat-photo .more{position:absolute;z-index:3;inset:0;background:#14284c91;color:#fff;display:grid;place-items:center;font-weight:850;font-size:21px}
.kt-chat-audio{display:flex;align-items:center;gap:10px;min-width:194px;max-width:260px}
.kt-chat-play{border:0;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;background:#ff781c;color:white;flex:0 0 32px}
.kt-chat-wave{display:flex;align-items:center;gap:2px;flex:1;height:28px;min-width:75px}
.kt-chat-wave i{display:block;width:3px;border-radius:4px;background:#ffad6a;height:var(--h,9px)}
.kt-chat-wave.playing i{animation:kt-wave 1.1s ease-in-out infinite alternate;animation-delay:var(--delay,0ms)}
@keyframes kt-wave{from{height:4px}to{height:var(--h,16px)}}
.kt-chat-audio span{color:#7f8ca0;font-size:10px;font-weight:750}
.kt-chat-file{display:flex;align-items:center;gap:10px;border:1px solid #e9edf2;border-radius:12px;background:#fff;padding:10px;color:#182d4f;text-decoration:none}
.kt-chat-file span{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:10px}
.kt-chat-file span small{font-size:9px;color:#8792a2}.kt-chat-file svg{color:#ff781c}
.kt-chat-bubble-toolbar{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.kt-chat-bubble-toolbar button{border:1px solid #edf0f4;background:#fff;border-radius:18px;color:#7e8b9f;padding:4px 8px;font-size:10px}
.kt-chat-typing{font-size:10px;color:#8b94a3;padding:0 18px 9px;display:flex;align-items:center;gap:6px}
.kt-chat-typing .dots{color:#ff781c;letter-spacing:2px}
.kt-chat-composer{display:flex;align-items:flex-end;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:white;border-top:1px solid #e8edf3;position:relative}
.kt-chat-composer textarea{flex:1;min-width:0;resize:none;min-height:42px;max-height:130px;border:0;outline:0;border-radius:22px;background:#f3f5f9;padding:12px 14px;font-size:12px;line-height:1.45;color:#172847}
.kt-chat-composer .kt-chat-round{border:0;border-radius:50%;background:#fff2e7;color:#f27818;width:40px;height:40px;flex-basis:40px}
.kt-chat-composer .kt-chat-send{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border:0;border-radius:50%;background:#ff781c;color:#fff;box-shadow:0 5px 12px #ff781c35}
.kt-chat-attachment-sheet{background:white;border:1px solid #edf0f4;border-radius:19px;padding:14px;box-shadow:0 10px 35px #14284c25;position:absolute;z-index:9;bottom:85px;left:12px;right:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kt-chat-attachment-sheet button{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff9f4;border:1px solid #f1e9e1;border-radius:12px;color:#1b3050;padding:12px 5px;font-size:10px}
.kt-chat-attachment-sheet svg{color:#ff781c}
.kt-chat-empty{margin:auto;text-align:center;padding:40px 12px;color:#7b8ca3}.kt-chat-empty h3{color:#132746}
.kt-chat-note{font-size:10px;color:#a0a9b5;padding:5px 18px 12px;background:white}
.kt-chat-popup{position:fixed;z-index:100;inset:0;background:#0d1b35a6;display:grid;place-items:center;padding:20px}
.kt-chat-dialog{width:min(100%,450px);max-height:85vh;overflow:auto;background:white;border-radius:21px;padding:22px;color:#132746;box-shadow:0 18px 60px #071b3544}
.kt-chat-dialog h3{font-size:18px;margin:0 0 8px}.kt-chat-dialog p{color:#73819a;font-size:12px;margin:0 0 15px;line-height:1.5}
.kt-chat-dialog .kt-chat-photo{width:100%;height:min(50vh,380px)}
.kt-chat-new-list{display:flex;flex-direction:column;gap:6px}
.kt-chat-new-list button{border:1px solid #edf0f4;background:#fff;display:flex;align-items:center;gap:10px;border-radius:14px;padding:9px;text-align:left;color:#14284c}
.kt-chat-new-list button strong{font-size:12px}
.kt-chat-new-list button small{font-size:10px;color:#7c899e}
.kt-chat-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
@media(min-width:800px){.kt-chat-layout{grid-template-columns:342px minmax(0,1fr)}.kt-chat-layout.kt-inbox .kt-chat-pane{display:flex}.kt-chat-inbox-head h1{font-size:26px}.kt-chat-scroll{padding:20px 27px}.kt-chat-pane{max-height:750px}}
@media(max-width:799px){.kt-chat-layout{border:0;box-shadow:none;border-radius:0;min-height:calc(100dvh - 205px);margin:0 -18px}.kt-chat-layout.kt-inbox .kt-chat-pane{display:none}.kt-chat-layout.kt-thread .kt-chat-inbox{display:none}.kt-chat-pane{min-height:calc(100dvh - 205px);max-height:calc(100dvh - 175px)}.kt-chat-mobile-back{display:grid}.kt-chat-list{max-height:none}.kt-chat-composer{padding-bottom:12px}.kt-chat-line{max-width:94%}.kt-chat-inbox-head{padding-top:19px}.kt-chat-thread-head{padding-inline:10px}}
@media(max-width:360px){.kt-chat-thread-actions .kt-chat-round{width:29px;height:33px;flex-basis:29px}.kt-chat-photo{height:105px}.kt-chat-stories{gap:11px}.kt-chat-avatar{width:42px;height:42px;flex-basis:42px}}
/* Keep the composer above the PWA's persistent navigation. */
.kt-chat-layout .kt-chat-pane{height:calc(100dvh - 244px);max-height:720px;min-height:500px}
.kt-chat-layout .kt-chat-inbox{max-height:inherit}
@media(min-width:800px){.kt-chat-layout{height:calc(100dvh - 246px);max-height:720px;min-height:500px}.kt-chat-pane{max-height:none!important;min-height:0!important;height:100%!important}.kt-chat-list{max-height:none}.kt-chat-bubble-toolbar{max-height:0;opacity:0;overflow:hidden;margin-top:0;transition:max-height .15s,opacity .15s}.kt-chat-line:hover .kt-chat-bubble-toolbar,.kt-chat-line:focus-within .kt-chat-bubble-toolbar{max-height:38px;opacity:1;margin-top:6px}}
@media(max-width:799px){.kt-chat-layout{min-height:calc(100dvh - 205px)}.kt-chat-layout .kt-chat-pane{height:calc(100dvh - 218px);max-height:none;min-height:440px}.kt-chat-bubble-toolbar button{padding:3px 7px;font-size:9px}.kt-chat-bubble-toolbar{opacity:.78}}
@media(max-height:680px){.kt-chat-layout .kt-chat-pane{min-height:350px}.kt-chat-layout{min-height:350px}}
.kt-chat-recording{background:#da4d47!important;color:#fff!important;animation:kt-pulse 1s infinite alternate}
@keyframes kt-pulse{from{opacity:.7}to{opacity:1}}

function load(){try{const s=JSON.parse(localStorage.getItem('kt_showcase_2026')||'null');return s&&s.version===3?s:seed()}catch(_){return seed()}}
let DB=load(),PAGE='home',DETAIL=null,MODAL=null,SEARCH='',CATEGORY='all',SORT='newest',BROWSEMODE='jobs',POSTSTEP=1,DRAFT={},WSTAB='updates',historyStack=[],timer;
function save(){try{localStorage.setItem('kt_showcase_2026',JSON.stringify(DB))}catch(_){}}
function notify(role,title,body,target='notifications'){DB.notifications.unshift({id:Date.now()+Math.random(),role,title,body,target,read:false});save()}
function toast(msg){const x=document.getElementById('toast');x.innerHTML=ic('check',18)+esc(msg);x.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>x.classList.remove('show'),3400)}
function go(p,detail){if(PAGE!==p||detail!==undefined)historyStack.push({page:PAGE,detail:DETAIL});PAGE=p;DETAIL=detail??null;SEARCH='';render();window.scrollTo(0,0)}
function back(){const q=historyStack.pop();if(q){PAGE=q.page;DETAIL=q.detail;render()}else go('home');window.scrollTo(0,0)}
function setRole(role){DB.role=role;save();PAGE='home';DETAIL=null;MODAL=null;historyStack=[];render();toast('Viewing as '+(role==='client'?'Client':'Tasker'))}
function idJob(id){return DB.jobs.find(x=>x.id===id)}
function idTasker(id){return DB.taskers.find(x=>x.id===id)}
function own(j){return j.owner==='client'&&DB.role==='client'}
function apFor(job){return DB.applications.filter(a=>a.job===job)}
const titleCase=s=>s?String(s)[0].toUpperCase()+String(s).slice(1):'';
function topHeader(){const unread=DB.notifications.some(n=>n.role===DB.role&&!n.read);return `<header class="site-head"><div class="content head-inner"><button data-route="home" style="border:0;background:transparent;padding:0" aria-label="Home"><img class="logo" src="${LOGO}" alt="KaziTasks — Jobs for All"></button><div class="head-right"><select class="lang" aria-label="Language" data-change="lang"><option value="en" ${DB.lang==='en'?'selected':''}>EN</option><option value="lg" ${DB.lang==='lg'?'selected':''}>LG</option><option value="sw" ${DB.lang==='sw'?'selected':''}>SW</option><option value="fr" ${DB.lang==='fr'?'selected':''}>FR</option></select><button class="round-btn" data-route="notifications" aria-label="Notifications">${ic('bell',20)}${unread?'<i class="unread"></i>':''}</button><button class="round-btn" data-route="account" aria-label="Account">${ic('user',20)}</button></div></div></header>`}
const NAV=[['home','home','Home'],['browse','search','Browse'],['post','plus','Post'],['chats','chat','Chats'],['account','user','Account']];
function bottomNav(){return `<nav class="nav" aria-label="Main navigation">${NAV.map(([p,ico,label])=>`<button class="${(PAGE===p||PAGE==='job'&&p==='browse'||PAGE==='tasker'&&p==='browse'||PAGE==='conversation'&&p==='chats')?'active':''}" data-route="${p}" aria-label="${esc(t(label))}"><span class="nav-symbol">${ic(ico,22)}</span><span>${esc(t(label))}</span></button>`).join('')}</nav>`}
function pageTitle(title,subtitle){return `<div class="pagebar"><button class="back" data-action="back" aria-label="Back">${ic('back',20)}</button><div><h1>${esc(title)}</h1>${subtitle?`<div class="sub">${esc(subtitle)}</div>`:''}</div></div>`}
function section(title,more,action){return `<div class="section-head"><h2>${esc(title)}</h2>${more?`<button class="text-link" data-route="${action||'browse'}">${esc(more)} ${ic('chevron',13)}</button>`:''}</div>`}

function post(){if(DB.role==='tasker')return `${pageTitle('Find work, not post work')}<div class="panel">${empty('You are viewing the Tasker role','Switch to Client to publish a task, or browse jobs to apply.')}<button class="btn full" data-route="browse">Browse jobs ${ic('arrow',17)}</button><button class="btn outline full" data-action="switch-role">Switch to Client</button></div>`;let body='';if(POSTSTEP===1)body=`<label class="form-label">Task title</label><input class="input" id="post-title" maxlength="100" value="${esc(DRAFT.title||'')}" placeholder="e.g. Fix kitchen power sockets"><label class="form-label">Category</label><select class="select" id="post-cat">${['cleaning','repair','delivery','moving','design'].map(x=>`<option ${DRAFT.cat===x?'selected':''} value="${x}">${titleCase(x)}</option>`).join('')}</select><label class="form-label">Describe the work</label><textarea class="textarea" id="post-desc" placeholder="What should the Tasker do?">${esc(DRAFT.desc||'')}</textarea><button class="btn full" data-action="post-next">Continue ${ic('arrow',17)}</button>`;else if(POSTSTEP===2)body=`<label class="form-label">Budget (UGX)</label><input class="input" id="post-budget" type="number" min="1000" value="${esc(DRAFT.price||80000)}"><label class="form-label">Location</label><input class="input" id="post-place" value="${esc(DRAFT.place||'Kampala')}" placeholder="Kampala, Uganda"><label class="form-label">Application deadline</label><input class="input" id="post-deadline" type="date" min="2026-10-29" value="${esc(DRAFT.deadline||'2026-11-12')}"><div class="split" style="margin-top:15px"><button class="btn outline" data-action="post-prev">Back</button><button class="btn" data-action="post-next">Review ${ic('arrow',16)}</button></div>`;else body=`<div class="panel" style="margin:0"><span class="pill">Ready to publish</span><h2 style="font-size:20px;color:var(--navy)">${esc(DRAFT.title)}</h2><p class="sub">${esc(DRAFT.desc)}</p><hr class="line"><div class="labelrow"><span>Budget</span><strong>${money(DRAFT.price)}</strong></div><div class="labelrow" style="margin-top:12px"><span>Location</span><strong>${esc(DRAFT.place)}</strong></div><div class="labelrow" style="margin-top:12px"><span>Deadline</span><strong>${esc(DRAFT.deadline)}</strong></div></div><p class="sub" style="margin:15px 0">Demo posting: no credits or real money will be charged.</p><div class="split"><button class="btn outline" data-action="post-prev">Edit</button><button class="btn" data-action="post-publish">Publish task ${ic('check',17)}</button></div>`;return `<div class="form-center">${pageTitle(t('Post a task'),'Create a clear brief to attract the right Tasker')}<div class="steps">${[1,2,3].map(i=>`<div class="step ${POSTSTEP>=i?'on':''}"></div>`).join('')}</div><div class="panel"><div class="labelrow"><h3>Step ${POSTSTEP} of 3</h3><span class="badge">${['','Task details','Budget & location','Review'][POSTSTEP]}</span></div>${body}</div></div>`}

worknote" data-id="${w.id}">Post update ${ic('send',14)}</button></div>`:WSTAB==='details'?`<div class="panel"><h3>Agreement overview</h3>${[['Job',w.title],['Client',w.client],['Tasker',w.tasker],['Agreed amount',money(w.price)],['Status',w.status]].map(([a,b])=>`<div class="receipt-detail"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}<p class="sub" style="margin-top:14px">Demo agreements are not contracts or escrow records.</p></div>`:WSTAB==='messages'?`<div class="panel"><h3>Project discussion</h3><p class="sub">Open the related conversation to coordinate the work.</p><button class="btn full" data-action="message" data-id="${w.tasker}">${ic('chat',16)} Open messages</button></div>`:`<div class="panel"><h3>Shared files</h3><p class="sub">Select a file to preview its name locally. Demo uploads are not sent to any server.</p><input type="file" id="project-file" class="input" accept="image/*,.pdf,.doc,.docx"><p id="file-feedback" class="filetext"></p></div>`}`}

function chatRooms(){ensureChatRooms();return DB.chatRooms.filter(r=>r.role===DB.role)}
function chatRoom(key){let room=chatRooms().find(r=>r.id===key||r.peer===key);if(!room){const peer=String(key||'KaziTasks Support');room=chatRoomInit(DB.role,peer,/team|group/i.test(peer),0,false);room.messages=[];DB.chatRooms.unshift(room);save()}return room}
function chatCurrentRoom(){const key=DETAIL||chatRooms()[0]?.id;return key?chatRoom(key):null}
function chatAvatar(peer,online=false,small=false){const name=String(peer||'?'),parts=name.trim().split(/\s+/),initials=parts.length>1?parts[0][0]+parts[parts.length-1][0]:name.slice(0,2),palette=['#fff0e0','#e7f0ff','#eaf7ee','#f3ebff','#ffe9ec','#e9f6fa'],i=[...name].reduce((a,c)=>a+c.charCodeAt(0),0)%palette.length,inks=['#c66a24','#4069b1','#218859','#7b51a7','#bc5578','#2e8491'];return `<span class="kt-chat-avatar ${online?'is-online':''}" style="--avatar-bg:${palette[i]};--avatar-ink:${inks[i]};${small?'width:30px;height:30px;flex-basis:30px;font-size:10px':''}">${esc(initials.toUpperCase())}</span>`}
function chatPreview(r){const m=r.messages.at(-1);return r.typing?'typing…':m?.kind==='photos'?'▧ Sent photos':m?.kind==='voice'?'◖ Voice message · '+(m.duration||'0:18'):m?.kind==='file'?'▤ '+(m.fileName||'Document'):m?.body||'Start a conversation'}
function chatFilteredRooms(){return chatRooms().filter(r=>{const q=CHAT_SEARCH.toLowerCase();return (!q||(r.peer+' '+r.subtitle+' '+chatPreview(r)).toLowerCase().includes(q))&&(CHAT_FILTER==='all'||CHAT_FILTER==='unread'&&r.unread>0||CHAT_FILTER==='groups'&&r.group||CHAT_FILTER==='favourites'&&r.favorite)}).sort((a,b)=>(b.unread>0)-(a.unread>0))}
function chatInbox(){const rooms=chatFilteredRooms(),all=chatRooms();const people=all.filter(r=>!r.group).slice(0,5);return `<section class="kt-chat-inbox" aria-label="Conversations"><div class="kt-chat-inbox-head"><h1>Messages</h1><button class="kt-chat-round kt-accent" data-chat="new" title="New conversation" aria-label="New conversation">${ic('edit',18)}</button></div><label class="kt-chat-search">${ic('search',16)}<input id="kt-chat-search" placeholder="Search conversations" value="${esc(CHAT_SEARCH)}" aria-label="Search conversations"><span>${ic('filter',16)}</span></label><div class="kt-chat-stories">${people.map(r=>`<button class="kt-chat-story" data-chat="open" data-id="${esc(r.id)}">${chatAvatar(r.peer,r.online)}<span>${esc(r.peer.split(' ')[0])}</span></button>`).join('')}</div><div class="kt-chat-filters">${[['all','All'],['unread','Unread'],['groups','Groups'],['favourites','Favourites']].map(([v,t])=>`<button class="kt-chat-filter ${CHAT_FILTER===v?'on':''}" data-chat="filter" data-val="${v}">${t}${v==='unread'&&all.some(r=>r.unread>0)?' · '+all.filter(r=>r.unread>0).length:''}</button>`).join('')}</div><div class="kt-chat-list">${rooms.length?rooms.map(r=>`<button class="kt-chat-item ${String(DETAIL)===r.id?'selected':''}" data-chat="open" data-id="${esc(r.id)}">${chatAvatar(r.peer,r.online)}<span class="kt-chat-who"><strong>${esc(r.peer)} ${r.muted?'◌':''}</strong><small class="${r.typing?'typing':''}">${esc(chatPreview(r))}</small></span><span class="kt-chat-meta"><time>${esc(r.messages.at(-1)?.time||'Today')}</time>${r.unread?`<span class="kt-chat-count">${r.unread}</span>`:r.messages.at(-1)?.mine?ic('check2',15):''}</span></button>`).join(''):`<div class="kt-chat-empty">${ic('search',26)}<h3>No conversations found</h3><p>Try a different search or filter.</p></div>`}</div></section>`}
function chatPhoto(photo,i){const data=(typeof photo?.data==='string'&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(photo.data))?photo.data:'';return `<button class="kt-chat-photo" data-chat="view-photo" data-index="${i}" aria-label="View ${esc(photo.label||'photo')}">${data?`<img src="${data}" alt="${esc(photo.label||'Photo')}" loading="lazy">`:`<span class="scene"></span>`}${i===2?'<span class="more">+2</span>':''}</button>`}
function chatWave(playing=false){const h=[8,15,11,23,18,9,20,13,27,16,10,24,11,17,8,19,12,16,7,13];return `<span class="kt-chat-wave ${playing?'playing':''}">${h.map((x,i)=>`<i style="--h:${x}px;--delay:${i*55}ms"></i>`).join('')}</span>`}
function chatBubble(m,r){const who=m.author||r.peer;let inside='';if(m.kind==='photos'){inside=`<div class="kt-chat-photo-grid">${(m.photos||[]).map(chatPhoto).join('')}</div><div>${esc(m.body||'Photos')}</div>`}else if(m.kind==='voice'){inside=`<div class="kt-chat-audio"><button class="kt-chat-play" data-chat="play" data-id="${esc(m.id)}" aria-label="Play voice note">${ic('play',16)}</button>${chatWave(false)}<span>${esc(m.duration||'0:18')}</span></div>`}else if(m.kind==='file'){inside=`<button class="kt-chat-file" data-chat="download" data-id="${esc(m.id)}">${ic('file',23)}<span><b>${esc(m.fileName||'Document')}</b><small>${esc(m.size||'Local preview file')}</small></span>${ic('download',17)}</button>`}else inside=esc(m.body||'');return `<div class="kt-chat-line ${m.mine?'mine':''}" data-mid="${esc(m.id)}">${!m.mine?chatAvatar(who,false,true):''}<div class="kt-chat-bubble">${r.group&&!m.mine?`<div class="kt-chat-sender">${esc(who)}</div>`:''}${inside}${m.reaction?`<div class="kt-chat-reactions">${esc(m.reaction)}</div>`:''}<div class="kt-chat-foot">${esc(m.time||'Now')} ${m.mine?ic('check2',14):''}</div><div class="kt-chat-bubble-toolbar"><button data-chat="react" data-id="${esc(m.id)}" title="React to message">♡ React</button><button data-chat="reply" data-id="${esc(m.id)}">Reply</button>${m.mine?`<button data-chat="delete-message" data-id="${esc(m.id)}">Delete</button>`:''}</div></div></div>`}
function chatThread(room){if(!room)return `<section class="kt-chat-pane"><div class="kt-chat-empty"><h3>Select a conversation</h3></div></section>`;const blocked=room.blocked;return `<section class="kt-chat-pane" aria-label="Conversation with ${esc(room.peer)}"><div class="kt-chat-thread-head"><button class="kt-chat-round kt-chat-mobile-back" data-chat="back" aria-label="Back to conversations">${ic('back',18)}</button>${chatAvatar(room.peer,room.online)}<span class="kt-chat-thread-person"><strong>${esc(room.peer)} ${room.group?'· Group':''}</strong><small class="${room.online?'':'subdued'}">${room.group?esc(room.subtitle):room.online?'● Online':'Available via KaziTasks'} · ${esc(room.subtitle)}</small></span><span class="kt-chat-thread-actions"><button class="kt-chat-round" data-chat="call" aria-label="Voice call">${ic('phone',17)}</button><button class="kt-chat-round" data-chat="video" aria-label="Video call">${ic('video',17)}</button><button class="kt-chat-round" data-chat="options" aria-label="Conversation options">${ic('more2',19)}</button></span></div><div class="kt-chat-scroll" id="kt-chat-scroll"><div class="kt-chat-date">Today</div>${room.messages.length?room.messages.map(m=>chatBubble(m,room)).join(''):`<div class="kt-chat-empty"><h3>Start your conversation</h3><p>Say hello and discuss the task.</p></div>`}</div>${room.typing?`<div class="kt-chat-typing">${esc(room.peer.split(' ')[0])} is typing <span class="dots">•••</span></div>`:''}${blocked?`<div class="kt-chat-composer"><p class="sub">This conversation is blocked. Unblock it in the menu to reply.</p></div>`:`<form id="kt-chat-compose" class="kt-chat-composer"><button class="kt-chat-round" type="button" data-chat="attachments" title="Attach media" aria-label="Attach media">${ic('plus',21)}</button><textarea id="kt-chat-input" rows="1" placeholder="Type a message…" aria-label="Type a message" maxlength="1200"></textarea><button class="kt-chat-round" type="button" data-chat="emoji" title="Emoji">${ic('smile',19)}</button>${CHAT_RECORDER?.state==='recording'?`<button class="kt-chat-send kt-chat-recording" type="button" data-chat="record" aria-label="Stop recording">■</button>`:`<button class="kt-chat-send" type="submit" aria-label="Send message">${ic('send',21)}</button>`}${CHAT_SHEET?`<div class="kt-chat-attachment-sheet">${CHAT_SHEET==='emoji'?['😊','👍','🎉','🙏','❤️','✅','👏','🔥','💼'].map(x=>`<button type="button" data-chat="insert-emoji" data-val="${x}"><span style="font-size:22px">${x}</span></button>`).join(''):`<button type="button" data-chat="choose-photo">${ic('image',24)}Photo</button><button type="button" data-chat="choose-file">${ic('paperclip',24)}Document</button><button type="button" data-chat="record">${ic('mic',24)}Voice note</button>`}</div>`:''}<input type="file" id="kt-chat-photos" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><input type="file" id="kt-chat-files" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.mp3,.wav" hidden></form>`}<div class="kt-chat-note">Interactive preview · Chat stays in this browser; nothing is delivered to real users.</div></section>`}
function chats(){return `<div class="kt-chat-layout kt-inbox">${chatInbox()}${chatThread(chatRooms()[0]||null)}</div>`}
function conversation(){const room=chatCurrentRoom();if(room&&room.unread){room.unread=0;save()}return `<div class="kt-chat-layout kt-thread">${chatInbox()}${chatThread(room)}</div>`}
function openConversation(key){CHAT_SHEET='';const r=chatRoom(key);r.unread=0;save();go('conversation',r.id);chatScrollBottom()}
function chatScrollBottom(){requestAnimationFrame(()=>{const box=document.getElementById('kt-chat-scroll');if(box)box.scrollTop=box.scrollHeight})}
function chatRefresh(keepComposer=false){let value=keepComposer?document.getElementById('kt-chat-input')?.value:'';render();if(keepComposer&&value){const el=document.getElementById('kt-chat-input');if(el)el.value=value}chatScrollBottom()}
function chatFindMessage(room,id){return room?.messages.find(m=>String(m.id)===String(id))}
function chatOpenModal(markup){CHAT_MODAL=markup;const old=document.getElementById('kt-chat-modal');if(old)old.remove();const node=document.createElement('div');node.id='kt-chat-modal';node.className='kt-chat-popup';node.innerHTML=`<div class="kt-chat-dialog" role="dialog" aria-modal="true">${markup}<div class="kt-chat-modal-actions"><button class="btn outline small" data-chat="modal-close">Close</button></div></div>`;document.body.appendChild(node)}
function chatCloseModal(){CHAT_MODAL=null;document.getElementById('kt-chat-modal')?.remove()}
function chatSendMessage(kind='text',props={}){const room=chatCurrentRoom();if(!room||room.blocked)return;const msg={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),mine:true,kind,time:new Date().toLocaleTimeString('en-UG',{hour:'2-digit',minute:'2-digit'}),status:'sent',...props};if(kind==='text'&&!String(msg.body||'').trim())return;room.messages.push(msg);save();CHAT_SHEET='';chatRefresh();if(kind==='text'&&!room.group){room.typing=true;chatRefresh();window.setTimeout(()=>{room.typing=false;const candidates=['Thanks for the update! I’ll get back to you shortly.','Great, I’ve noted that for the task.','That works for me. Let’s keep the project moving.'];room.messages.push({id:'reply-'+Date.now(),mine:false,kind:'text',body:candidates[room.messages.length%3],time:new Date().toLocaleTimeString('en-UG',{hour:'2-digit',minute:'2-digit'}),status:'read'});room.unread=0;save();if(PAGE==='conversation'&&chatCurrentRoom()?.id===room.id)chatRefresh();notify(room.role,'New sample reply',room.peer+' replied in your preview','chats')},1400)} }
function chatAcceptFile(file,kind){if(!file)return;const max=1.2*1024*1024;if(file.size>max){toast('For this offline preview, choose a file smaller than 1.2 MB');return}if(kind==='photos'&&!file.type.startsWith('image/')){toast('Choose an image file');return}const r=new FileReader();r.onload=()=>{const data=String(r.result||'');const props=kind==='photos'?{body:file.name,photos:[{label:file.name,data}]}:{body:file.name,fileName:file.name,size:Math.max(1,Math.round(file.size/1024))+' KB',fileData:data};chatSendMessage(kind,props);toast('Attachment saved to this browser only')};r.onerror=()=>toast('Unable to read this file');r.readAsDataURL(file)}
function chatPlayAudio(m){if(!m)return;if(m.audioData&&/^data:audio\//.test(m.audioData)){if(CHAT_AUDIO){CHAT_AUDIO.pause();CHAT_AUDIO=null}CHAT_AUDIO=new Audio(m.audioData);CHAT_AUDIO.play().catch(()=>toast('Browser blocked audio playback'));return}if(!window.speechSynthesis){toast('Voice playback is not supported by this browser');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m.body||'Hello! Here is a quick update about the task.');u.rate=1.05;u.lang='en-GB';speechSynthesis.speak(u)}
async function chatRecord(){if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){toast('This browser cannot record audio here. Try Chrome on localhost or HTTPS.');return}if(CHAT_RECORDER?.state==='recording'){CHAT_RECORDER.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});CHAT_RECORD_CHUNKS=[];CHAT_RECORDER=new MediaRecorder(stream);CHAT_RECORDER.ondataavailable=e=>{if(e.data?.size)CHAT_RECORD_CHUNKS.push(e.data)};CHAT_RECORDER.onstop=()=>{const blob=new Blob(CHAT_RECORD_CHUNKS,{type:CHAT_RECORDER.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());if(blob.size>1.2*1024*1024){toast('Recording too long for offline storage; try a shorter note');return}const reader=new FileReader();reader.onload=()=>{chatSendMessage('voice',{body:'Recorded voice message',audioData:String(reader.result),duration:'0:10'});toast('Voice note saved locally')};reader.readAsDataURL(blob)};CHAT_RECORDER.start();toast('Recording microphone… tap Voice note again to stop');CHAT_SHEET='';chatRefresh()}catch(e){toast('Microphone permission unavailable: '+(e.name||'Try a secure page'))}}
function chatStartNew(){const names=DB.role==='client'?['Amina Hassan','David Musoke','Ruth Wanjiku','Sarah Nakato','Peter Otieno','Kazi Homes']:['Joshua','Amina Hassan','Task Team','Brian Kato'];chatOpenModal(`<h3>New conversation</h3><p>Choose someone to message in this local preview.</p><div class="kt-chat-new-list">${names.map(n=>`<button data-chat="new-open" data-id="${esc(n)}">${chatAvatar(n)}<span><strong>${esc(n)}</strong><small>Start a conversation</small></span></button>`).join('')}<button data-chat="new-open" data-id="Project Team">${chatAvatar('Project Team')}<span><strong>New project group</strong><small>Preview a group chat</small></span></button></div>`)}
function chatMenu(){const r=chatCurrentRoom();if(!r)return;chatOpenModal(`<h3>${esc(r.peer)}</h3><p>Conversation controls · Changes affect this browser only.</p><div class="kt-chat-new-list"><button data-chat="toggle-favourite">${ic('heart',20)} <span><strong>${r.favorite?'Remove favourite':'Add to favourites'}</strong><small>Pin important conversations</small></span></button><button data-chat="toggle-mute">${ic('mute',20)} <span><strong>${r.muted?'Unmute conversation':'Mute conversation'}</strong><small>Quiet notifications for this chat</small></span></button><button data-chat="toggle-block">${ic('shield',20)} <span><strong>${r.blocked?'Unblock messages':'Block conversation'}</strong><small>Block local composing</small></span></button><button data-chat="clear-chat">${ic('trash',20)} <span><strong>Clear chat</strong><small>Delete local sample messages from this thread</small></span></button></div>`)}
function chatEventAction(action,el){const r=chatCurrentRoom(),id=el.dataset.id,val=el.dataset.val;switch(action){
 case 'open':openConversation(id);break;
 case 'back':CHAT_SHEET='';go('chats');break;
 case 'filter':CHAT_FILTER=val;chatRefresh();break;
 case 'new':chatStartNew();break;
 case 'new-open':chatCloseModal();openConversation(id);break;
 case 'attachments':CHAT_SHEET=CHAT_SHEET==='attach'?'':'attach';chatRefresh(true);break;
 case 'emoji':CHAT_SHEET=CHAT_SHEET==='emoji'?'':'emoji';chatRefresh(true);break;
 case 'insert-emoji':{const field=document.getElementById('kt-chat-input');if(field){field.value+=val;field.focus()}CHAT_SHEET='';document.querySelector('.kt-chat-attachment-sheet')?.remove();break}
 case 'choose-photo':document.getElementById('kt-chat-photos')?.click();break;
 case 'choose-file':document.getElementById('kt-chat-files')?.click();break;
 case 'record':chatRecord();break;
 case 'play':chatPlayAudio(chatFindMessage(r,id));break;
 case 'view-photo':{const m=el.closest('[data-mid]'),msg=chatFindMessage(r,m?.dataset.mid),photo=msg?.photos?.[Number(el.dataset.index)];chatOpenModal(`<h3>Photo preview</h3><p>${esc(photo?.label||'Work progress photo')}</p>${photo?.data?`<img src="${photo.data}" style="width:100%;border-radius:14px" alt="Uploaded photo">`:`<div class="kt-chat-photo" style="height:270px"><span class="scene"></span></div>`}`);break}
 case 'download':{const m=chatFindMessage(r,id);if(!m)break;if(m.fileData){const a=document.createElement('a');a.href=m.fileData;a.download=m.fileName||'attachment';a.click()}else{const blob=new Blob(['Sample KaziTasks attachment\n\nThis is a placeholder document in the offline design preview.'],{type:'text/plain'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='kazitasks-sample-file.txt';a.click();URL.revokeObjectURL(u)}break}
 case 'react':{const m=chatFindMessage(r,id);if(m){m.reaction=m.reaction?'':'❤️';save();chatRefresh()}break}
 case 'reply':{const m=chatFindMessage(r,id),input=document.getElementById('kt-chat-input');if(m&&input){input.value='↪ '+(m.body||m.fileName||'Attachment').slice(0,45)+'\n';input.focus()}break}
 case 'delete-message':if(window.confirm('Remove this message from your local preview?')){r.messages=r.messages.filter(m=>String(m.id)!==String(id));save();chatRefresh()}break;
 case 'options':chatMenu();break;
 case 'call':case 'video':chatOpenModal(`<h3>${action==='call'?'Voice call':'Video call'}</h3><p>This is an interactive design preview. Live audio/video calling requires a secure calling service and real user connections.</p>`);break;
 case 'toggle-favourite':r.favorite=!r.favorite;save();chatCloseModal();chatRefresh();toast(r.favorite?'Added to favourites':'Removed from favourites');break;
 case 'toggle-mute':r.muted=!r.muted;save();chatCloseModal();chatRefresh();toast(r.muted?'Conversation muted':'Conversation unmuted');break;
 case 'toggle-block':r.blocked=!r.blocked;save();chatCloseModal();chatRefresh();toast(r.blocked?'Conversation blocked locally':'Conversation unblocked');break;
 case 'clear-chat':if(window.confirm('Clear messages from this browser?')){r.messages=[];save();chatCloseModal();chatRefresh()}break;
 case 'modal-close':chatCloseModal();break;
 }}
document.addEventListener('click',event=>{const btn=event.target.closest('[data-chat]');if(!btn)return;event.preventDefault();chatEventAction(btn.dataset.chat,btn)});
document.addEventListener('input',event=>{if(event.target.id==='kt-chat-search'){CHAT_SEARCH=event.target.value;const list=document.querySelector('.kt-chat-list');if(list){const rooms=chatFilteredRooms();list.innerHTML=rooms.map(r=>`<button class="kt-chat-item" data-chat="open" data-id="${esc(r.id)}">${chatAvatar(r.peer,r.online)}<span class="kt-chat-who"><strong>${esc(r.peer)}</strong><small>${esc(chatPreview(r))}</small></span><span class="kt-chat-meta"><time>${esc(r.messages.at(-1)?.time||'Today')}</time>${r.unread?`<span class="kt-chat-count">${r.unread}</span>`:''}</span></button>`).join('')||'<div class="kt-chat-empty">No conversations found</div>'}}});
document.addEventListener('change',event=>{if(event.target.id==='kt-chat-photos'){const files=[...event.target.files||[]];files.slice(0,3).forEach(f=>chatAcceptFile(f,'photos'))}if(event.target.id==='kt-chat-files'){const file=event.target.files?.[0];chatAcceptFile(file,'file')}});
document.addEventListener('submit',event=>{if(event.target.id!=='kt-chat-compose')return;event.preventDefault();event.stopPropagation();const text=event.target.querySelector('#kt-chat-input')?.value.trim();if(text)chatSendMessage('text',{body:text.slice(0,1200)})});

function wallet(){const tx=DB.transactions.filter(x=>x.role===DB.role).slice(0,5);return `${pageTitle(t('Wallet'),'Your KaziTasks balance & activity')}<div class="wallet-two"><div><div class="wallet-hero"><small>Available balance · Sample</small><strong>${money(DB.wallets[DB.role])}</strong><div class="wallet-actions"><button data-action="topup">${ic('plus',19)} Add funds</button><button data-action="withdraw">${ic('upload',19)} Withdraw</button><button data-route="transactions">${ic('receipt',18)} History</button></div></div><div class="panel"><div class="labelrow"><strong style="font-size:12px">Wallet access</strong><span class="badge ${DB.pinSet?'green':'orange'}">${DB.pinSet?'Demo PIN configured':'PIN not set'}</span></div><p class="sub" style="margin:8px 0">Test the 4-digit PIN screen. Never enter a real wallet PIN in this demo.</p><button class="btn soft small" data-action="pin">${ic('lock',15)} ${DB.pinSet?'Change demo PIN':'Set demo PIN'}</button></div></div><div>${section(t('Recent activity'),'View all','transactions')}<div class="panel">${tx.length?tx.map(x=>txnRow(x)).join(''):empty('No transactions','Try a demo top-up to create one.')}<button class="btn outline full" data-route="transactions">${ic('receipt',16)} Transaction history</button></div></div></div>`}

function transactions(){let x=DB.transactions.filter(z=>z.role===DB.role);return `${pageTitle('Transaction history','Tap a transaction to see its receipt')}<div class="panel">${x.length?x.map(txnRow).join(''):empty('No activity yet','Wallet demo transactions appear here.')}</div>`}
function receipt(){let x=DB.transactions.find(z=>z.id===DETAIL);if(!x)return transactions();return `${pageTitle('Payment receipt','KaziTasks · Transaction details')}<div class="receipt"><div class="receipt-center"><span class="check">${ic('check',31)}</span><h2>Transaction recorded</h2><p class="sub">Sample transaction · No payment was processed</p><h1 style="color:var(--orange);font-size:27px;letter-spacing:-.6px">${money(Math.abs(x.amount))}</h1></div><div class="labelrow" style="margin:18px 0"><img src="${LOGO}" style="width:125px;height:36px;object-fit:contain" alt="KaziTasks"><small class="sub">${esc(x.date)}</small></div>${[['Transaction ID',x.id],['Description',x.type],['Amount',money(Math.abs(x.amount))],['Method',x.method],['Reference',x.ref],['Status','Sample transaction']].map(([a,b])=>`<div class="receipt-detail"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}</div><div class="split no-print" style="margin:15px 0"><button class="btn outline" data-action="copy-receipt">${ic('copy',16)} Copy ID</button><button class="btn" data-action="print">${ic('download',16)} Print receipt</button></div><button class="btn soft full no-print" data-route="wallet">Back to wallet</button>`}
function notifications(){const items=DB.notifications.filter(x=>x.role===DB.role);return `${pageTitle(t('Notifications'),'Applications, offers, messages and work updates')}<button class="btn soft small" data-action="markread">${ic('check',16)} Mark all read</button><div class="panel">${items.length?items.map(x=>`<button class="listrow" data-action="notice" data-id="${x.id}" style="width:100%;text-align:left;border-left:0;border-top:0;border-right:0;background:transparent"><div class="avatar">${ic(x.read?'bell':'spark',19)}</div><div class="details"><strong>${esc(x.title)} ${x.read?'':'<span class="statusdot"></span>'}</strong><small>${esc(x.body)}</small></div>${ic('chevron',16)}</button>`).join(''):empty('You’re all caught up','New local demo activity will appear here.')}</div>`}
function account(){const name=DB.role==='client'?DB.clientName:DB.taskerName;return `${pageTitle(t('Account'),'Manage your KaziTasks experience')}<div class="panel"><div class="labelrow"><div class="tasker-top"><div class="avatar person">${esc(name[0])}</div><div><h3>${esc(name)} <span class="pill green">Preview account</span></h3><p class="sub">${DB.role==='client'?'Client':'Tasker'} · Kampala, Uganda</p></div></div><button class="round-btn" data-action="profile-edit" aria-label="Edit account">${ic('edit',17)}</button></div><hr class="line"><div class="labelrow"><div><strong style="font-size:12px">Profile completion</strong><p class="sub" style="margin-top:4px">Applications allowed at 40% in this demo</p></div><strong style="color:var(--orange)">${DB.profile}%</strong></div><div class="progress" style="margin-top:10px"><span style="width:${DB.profile}%"></span></div></div><div class="panel"><h3>${t('Switch role')}</h3><div class="select-role"><button class="btn ${DB.role==='client'?'selected':'outline'}" data-action="role" data-val="client">${ic('user',16)} Client</button><button class="btn ${DB.role==='tasker'?'selected':'outline'}" data-action="role" data-val="tasker">${ic('briefcase',16)} Tasker</button></div><label class="form-label">Language</label><select class="select" data-change="lang"><option value="en" ${DB.lang==='en'?'selected':''}>English</option><option value="lg" ${DB.lang==='lg'?'selected':''}>Luganda</option><option value="sw" ${DB.lang==='sw'?'selected':''}>Kiswahili</option><option value="fr" ${DB.lang==='fr'?'selected':''}>Français</option></select></div><div class="panel">${[['wallet','wallet',t('Wallet'),'Balance and transactions'],['workspace','briefcase',t('Workspace'),'Projects and milestones'],['applications','doc',t('Applications'),'Submitted and received applications'],['offers','send','Job offers','Invitations and proposals'],['saved','heart',t('Saved jobs'),'Your favourite opportunities'],['subscription','star','Subscription','Plan and credits'],['security','lock','Security','Demo wallet PIN and login'],['help','chat','Help & support','Frequently asked questions']].map(([page,icon,label,sub])=>`<button class="listrow" data-route="${page}" style="text-align:left;background:transparent;border-left:0;border-top:0;border-right:0;width:100%"><span class="avatar">${ic(icon,20)}</span><div class="details"><strong>${esc(label)}</strong><small>${esc(sub)}</small></div>${ic('chevron',16)}</button>`).join('')}</div><button class="btn outline full" data-action="logout">${ic('logout',16)} ${t('Sign out')}</button><button class="text-link" style="display:block;margin:18px auto 0" data-action="reset-demo">Reset sample data</button>`}
function security(){return `${pageTitle('Account security','Test authentication and wallet controls')}<div class="panel"><h3>Wallet PIN</h3><p class="sub">The interactive preview does not store real secrets or protect real funds. Please use a disposable demo PIN only.</p><button class="btn soft full" data-action="pin">${ic('lock',16)} ${DB.pinSet?'Update demo PIN':'Set up demo PIN'}</button></div><div class="panel"><h3>Password recovery</h3><p class="sub">See how a password reset request would appear. No emails are sent from this file.</p><button class="btn outline full" data-action="forgot">${ic('refresh',16)} Test forgot password</button></div><div class="panel"><h3>Authentication</h3><p class="sub">Switch to the demo login screen to test sign-in and registration UX.</p><button class="btn outline full" data-action="logout">${ic('logout',16)} Test logout</button></div>`}
function subscription(){return `${pageTitle('Plans & credits','Explore subscription presentation')}<div class="panel"><span class="badge green">Current plan</span><h2 style="color:var(--navy)">${esc(DB.subscription)}</h2><p class="sub">This HTML does not buy credits or activate real subscriptions.</p></div><div class="split">${['Free','Basic','Pro'].map(p=>`<div class="panel" style="margin:0"><h3>${p}</h3><p class="sub">${p==='Free'?'Explore the marketplace':p==='Basic'?'More tools and access':'Advanced professional features'}</p><button class="btn small ${DB.subscription===p?'outline':''}" style="margin-top:12px" data-action="plan" data-val="${p}">${DB.subscription===p?'Current':'Preview'}</button></div>`).join('')}</div>`}
function help(){return `${pageTitle('Help & support','KaziTasks marketplace guidance')}<div class="panel">${[['How do I post a task?','Select Post, enter the work details, budget and location, then publish.'],['How do Taskers apply?','Switch to Tasker and open a job. Profile completion must reach 40% in this preview.'],['When is money charged?','The HTML preview never processes money. Production payments require a connected and verified backend.'],['How do I reset my password?','Use the Forgot password link on the demo sign-in screen. It shows the flow but sends no email.'],['Where is my Workspace?','Open Account → Workspace to review assigned work, milestone progress and notes.']].map(([q,a])=>`<details class="listrow" style="display:block"><summary style="font-weight:800;color:var(--navy);cursor:pointer">${q}</summary><p class="sub" style="margin-top:9px">${a}</p></details>`).join('')}</div>`}
function auth(){return `<div class="auth"><img class="logo" src="${LOGO}" alt="KaziTasks"><h1>Jobs for All. Welcome.</h1><p>Explore the full Client and Tasker experience</p><div class="panel"><h3 style="text-align:center">Explore KaziTasks</h3><label class="form-label">Email or phone</label><input class="input" placeholder="your@email.com" id="login-user" autocomplete="off"><label class="form-label">Password</label><input type="password" class="input" placeholder="Test password only" id="login-pass" autocomplete="off"><button class="btn full" data-action="login">Continue ${ic('arrow',17)}</button><button class="text-link" style="display:block;margin:12px auto" data-action="forgot">Forgot password?</button><hr class="line"><button class="btn outline full" data-action="signup">Create preview account</button><div class="split" style="margin-top:10px"><button class="btn soft small" data-action="quick-login" data-val="client">Enter as Client</button><button class="btn soft small" data-action="quick-login" data-val="tasker">Enter as Tasker</button></div></div><p>Preview access only. Do not use your real password or wallet PIN.</p></div>`}
function render(){const root=document.getElementById('app');let body;switch(PAGE){case 'home':body=home();break;case 'browse':body=browse();break;case 'job':body=jobDetail();break;case 'tasker':body=profile();break;case 'post':body=post();break;case 'applications':body=applications();break;case 'workspace':body=workspaces();break;case 'workspace-detail':body=workspaceDetail();break;case 'offers':body=offers();break;case 'saved':body=saved();break;case 'chats':body=chats();break;case 'conversation':body=conversation();break;case 'wallet':body=wallet();break;case 'transactions':body=transactions();break;case 'receipt':body=receipt();break;case 'notifications':body=notifications();break;case 'account':body=account();break;case 'security':body=security();break;case 'subscription':body=subscription();break;case 'help':body=help();break;default:body=home()}
root.innerHTML=`<div class="app">${DB.signed?`${topHeader()}<main class="content view">${body}</main>${bottomNav()}`:`<main class="content">${auth()}</main>`}</div>`;document.getElementById('popup').innerHTML=MODAL?modalMarkup():'';}
function openModal(name,data={}){MODAL={name,...data};render()}
function closeModal(){MODAL=null;render()}
function modalMarkup(){const m=MODAL;if(!m)return '';let inner='';switch(m.name){
case 'apply':{const j=idJob(m.id);inner=`<p class="sub" style="margin:10px 0">${esc(j?.title)} · ${money(j?.price||0)}</p><form id="apply-form"><label class="form-label">Your proposed budget (UGX)</label><input class="input" name="bid" type="number" min="1000" value="${j?.price||80000}" required><label class="form-label">Why are you a good fit?</label><textarea class="textarea" name="note" placeholder="Share your experience and availability" required></textarea><button class="btn full" type="submit">Submit application ${ic('arrow',16)}</button></form>`;break}
case 'offer':{const p=idTasker(m.id),item=DB.offers.find(o=>o.id===m.offerId);inner=`<p class="sub" style="margin:10px 0">Send an invitation to ${esc(p?.name||item?.tasker||'Tasker')}. The Tasker can accept or decline.</p><form id="offer-form"><label class="form-label">Choose your task</label><select class="select" name="job" required>${DB.jobs.filter(j=>j.owner==='client').map(j=>`<option value="${j.id}" ${item?.job===j.id?'selected':''}>${esc(j.title)}</option>`).join('')}</select><label class="form-label">Proposed amount (UGX)</label><input class="input" type="number" name="price" min="1000" value="${item?.price||p?.price||100000}" required><label class="form-label">Message</label><textarea name="note" class="textarea" placeholder="Describe the offer and timeline">${esc(item?.note||'')}</textarea><button class="btn full" type="submit">${item?'Save changes':'Send offer'} ${ic('send',15)}</button></form>`;break}
case 'confirm-accept':{const a=DB.applications.find(a=>a.id===m.id);const job=idJob(a?.job);inner=`<p class="sub" style="margin:12px 0">Assign <b>Alex</b> to <b>${esc(job?.title||'this task')}</b> at <b>${money(a?.bid||0)}</b>?</p><p class="sub">This creates a local Workspace for review. It does not charge the wallet or create a real contract.</p><div class="split" style="margin-top:15px"><button class="btn outline" data-action="modal-close">Cancel</button><button class="btn" data-action="confirm-accept" data-id="${m.id}">Assign Tasker</button></div>`;break}
case 'topup':inner=`<p class="sub" style="margin:10px 0">This simulates funds arriving. No mobile-money prompt will be sent.</p><form id="topup-form"><label class="form-label">Amount (UGX)</label><input class="input" name="amount" type="number" min="1000" value="50000" required><label class="form-label">Demo method</label><select name="method" class="select"><option>Mobile Money (demo)</option><option>Bank card (demo)</option></select><button class="btn full" type="submit">Add demo funds ${ic('check',16)}</button></form>`;break;
case 'withdraw':inner=`<p class="sub" style="margin:10px 0">Preview a withdrawal. Available: ${money(DB.wallets[DB.role])}. No payout will occur.</p><form id="withdraw-form"><label class="form-label">Amount (UGX)</label><input class="input" type="number" name="amount" min="1000" max="${DB.wallets[DB.role]}" value="20000" required><label class="form-label">Demo Wallet PIN</label><input class="input" name="pin" type="password" inputmode="numeric" maxlength="4" placeholder="Use 2468" required><p class="sub" style="margin-top:7px">Use demo code <b>2468</b>. Never use your real PIN.</p><button class="btn full" type="submit">Preview withdrawal ${ic('lock',16)}</button></form>`;break;
case 'pin':inner=`<p class="sub" style="margin:11px 0">Enable the demonstration PIN. The preview uses the disposable code <b>2468</b>, not a secure wallet credential.</p><form id="pin-form"><label class="form-label">Demo PIN</label><input class="input" name="pin" type="password" maxlength="4" inputmode="numeric" placeholder="2468" required><button class="btn full" type="submit">Enable PIN preview ${ic('check',16)}</button></form>`;break;
case 'forgot':inner=`<p class="sub" style="margin:10px 0">Preview how password recovery looks. This HTML file cannot send real email.</p><form id="forgot-form"><label class="form-label">Email</label><input class="input" name="email" type="email" required placeholder="your@email.com"><button class="btn full" type="submit">Request reset link ${ic('send',16)}</button></form>`;break;
case 'signup':inner=`<p class="sub" style="margin:10px 0">Create a local demonstration account to see the registration UX.</p><form id="signup-form"><label class="form-label">Name</label><input class="input" name="name" required placeholder="Your name"><label class="form-label">Email</label><input type="email" class="input" name="email" required placeholder="your@email.com"><label class="form-label">Role</label><select class="select" name="role"><option value="client">Client</option><option value="tasker">Tasker</option></select><button class="btn full" type="submit">Create preview account</button></form>`;break;
case 'profile-edit':inner=`<form id="profile-form"><label class="form-label">Display name</label><input class="input" name="name" value="${esc(DB.role==='client'?DB.clientName:DB.taskerName)}" required><label class="form-label">Profile completion (demo slider)</label><input style="width:100%;accent-color:var(--orange)" type="range" name="completion" min="0" max="100" value="${DB.profile}" oninput="document.getElementById('pct-label').textContent=this.value+'%'"><div class="sub" id="pct-label">${DB.profile}%</div><p class="sub" style="margin:12px 0">Tasker applications are enabled at 40% in this demonstration.</p><button class="btn full" type="submit">Save profile</button></form>`;break;
case 'appointment':inner=`<form id="appointment-form"><p class="sub">Schedule a discussion (local preview only).</p><label class="form-label">Date and time</label><input class="input" type="datetime-local" name="when" required><label class="form-label">Note</label><textarea class="textarea" name="note" placeholder="What will you discuss?"></textarea><button class="btn full" type="submit">Add demo reminder</button></form>`;break;
default:inner='<p>Preview action</p>'}
const labels={apply:'Apply for task',offer:m.offerId?'Edit pending offer':'Send job offer','confirm-accept':'Confirm assignment',topup:'Add demo funds',withdraw:'Demo withdrawal',pin:'Wallet PIN preview',forgot:'Forgot password',signup:'Create an account','profile-edit':'Edit account',appointment:'Schedule a discussion'};
return `<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(labels[m.name]||'Dialog')}"><div class="modal-grab"></div><div class="modal-header"><h2>${esc(labels[m.name]||'Dialog')}</h2><button class="modal-close" data-action="modal-close" aria-label="Close">${ic('close',18)}</button></div>${inner}</div></div>`}
function addWorkspace(job,tasker,price){let w=DB.workspaces.find(w=>w.job===job.id&&w.tasker===tasker);if(w)return w;w={id:'WS-'+Math.floor(1000+Math.random()*8000),job:job.id,title:job.title,tasker,client:DB.clientName,price,status:'active',steps:[true,false,false,false],notes:[]};DB.workspaces.unshift(w);job.status='assigned';notify('client','Tasker assigned',`Workspace created for ${job.title}`,'workspace');notify('tasker','You have a new assignment',`Open Workspace to see ${job.title}`,'workspace');return w}
function transaction(type,amount,method,ref){const rec={id:'KT-'+Math.floor(1000000+Math.random()*9000000),type,amount,role:DB.role,date:new Date().toISOString().slice(0,10),method,ref};DB.transactions.unshift(rec);save();return rec}
function fromInput(id){return document.getElementById(id)?.value?.trim()||''}
function doAction(a,el){const id=el.dataset.id,val=el.dataset.val;switch(a){
case 'back':back();break;case 'modal-close':closeModal();break;
case 'role':setRole(val);break;case 'switch-role':setRole(DB.role==='client'?'tasker':'client');break;
case 'job':go('job',id);break;case 'tasker':go('tasker',id);break;case 'workspace':go('workspace-detail',id);break;case 'receipt':go('receipt',id);break;
case 'message':openConversation(id||'Sarah Nakato');break;
case 'save':{if(DB.saved.includes(id)){DB.saved=DB.saved.filter(x=>x!==id);toast('Removed from saved jobs')}else{DB.saved.push(id);toast('Job saved to your shortlist')}save();render();break}
case 'mode':BROWSEMODE=val;render();break;case 'cat':CATEGORY=val;render();break;case 'sort':SORT=SORT==='budget'?'newest':'budget';render();break;
case 'search':{const q=fromInput('searchbox');SEARCH=q;if(PAGE==='home'){PAGE='browse';BROWSEMODE=DB.role==='client'?'taskers':'jobs'}render();break}
case 'apply':if(DB.profile<40){toast('Reach 40% profile completion to apply');go('account')}else if(DB.role!=='tasker')toast('Switch to Tasker before applying');else openModal('apply',{id});break;
case 'accept':openModal('confirm-accept',{id});break;
case 'confirm-accept':{let ap=DB.applications.find(a=>a.id===id);let j=idJob(ap?.job);if(!ap||!j)break;ap.status='accepted';DB.applications.filter(x=>x.job===j.id&&x.id!==id).forEach(x=>x.status='declined');const w=addWorkspace(j,ap.tasker,ap.bid);save();MODAL=null;toast('Tasker assigned. Workspace opened.');go('workspace-detail',w.id);break}
case 'offer':{if(DB.role==='tasker'){toast('Offers are sent by Clients');break}openModal('offer',{id});break}
case 'offer-edit':openModal('offer',{id:null,offerId:id});break;
case 'offer-accept':{let o=DB.offers.find(o=>o.id===id);if(!o||o.status!=='pending')break;o.status='accepted';let j=idJob(o.job);if(j)addWorkspace(j,o.tasker,o.price);notify('client','Offer accepted',`${o.tasker} accepted your offer`,'offers');save();render();toast('Offer accepted — Workspace created');break}
case 'offer-decline':{let o=DB.offers.find(o=>o.id===id);if(o)o.status='declined';notify('client','Offer declined','A Tasker declined the pending offer','offers');save();render();toast('Offer declined');break}
case 'wstab':WSTAB=val;render();break;
case 'milestone':{let w=DB.workspaces.find(w=>w.id===id);let n=Number(el.dataset.index);if(w){w.steps[n]=true;if(w.steps.every(Boolean))w.status='completed';notify(DB.role==='client'?'tasker':'client','Workspace progress',`${w.title}: milestone updated`,'workspace');save();render();toast('Milestone updated in demo')}break}
case 'worknote':{let v=fromInput('worknote');if(!v){toast('Write a note before posting');break}let w=DB.workspaces.find(w=>w.id===id);w?.notes.push({author:DB.role==='client'?DB.clientName:DB.taskerName,text:v});save();render();toast('Progress note added');break}
case 'post-next':{if(POSTSTEP===1){let title=fromInput('post-title'),desc=fromInput('post-desc');if(title.length<4||desc.length<10){toast('Add a title and description (at least 10 characters)');break}Object.assign(DRAFT,{title,cat:document.getElementById('post-cat').value,desc});POSTSTEP=2}else if(POSTSTEP===2){let price=Number(fromInput('post-budget')),place=fromInput('post-place'),deadline=fromInput('post-deadline');if(price<1000||!place||!deadline){toast('Provide a budget, location and deadline');break}Object.assign(DRAFT,{price,place,deadline});POSTSTEP=3}render();break}
case 'post-prev':POSTSTEP=Math.max(1,POSTSTEP-1);render();break;
case 'post-publish':{let j={...DRAFT,id:'KZ-'+Math.floor(5000+Math.random()*4000),status:'open',owner:'client'};DB.jobs.unshift(j);notify('tasker','New job opportunity',`${j.title} — ${money(j.price)}`,'browse');notify('client','Task published',`Your job ${j.title} is open for applications`,'applications');DRAFT={};POSTSTEP=1;save();toast('Demo task published — switch roles to apply');go('applications');break}
case 'topup':openModal('topup');break;case 'withdraw':if(!DB.pinSet){toast('First enable your demo PIN');openModal('pin')}else openModal('withdraw');break;case 'pin':openModal('pin');break;
case 'markread':DB.notifications.filter(n=>n.role===DB.role).forEach(n=>n.read=true);save();render();toast('All alerts marked read');break;
case 'notice':{let n=DB.notifications.find(n=>String(n.id)===String(id));if(n){n.read=true;save();go(n.target||'notifications')}break}
case 'copy-receipt':{let tx=DB.transactions.find(x=>x.id===DETAIL);if(tx&&navigator.clipboard?.writeText){navigator.clipboard.writeText(tx.id).then(()=>toast('Transaction ID copied')).catch(()=>toast('Copy unavailable in this browser'))}else toast('Copy requires browser clipboard permission');break}
case 'print':window.print();break;
case 'profile-edit':openModal('profile-edit');break;case 'forgot':openModal('forgot');break;case 'signup':openModal('signup');break;
case 'login':{if(!fromInput('login-user')||!fromInput('login-pass')){toast('Enter demo details, or choose quick login');break}DB.signed=true;save();go('home');toast('Preview opened — no account authentication');break}
case 'quick-login':DB.signed=true;setRole(val);save();go('home');break;
case 'logout':DB.signed=false;MODAL=null;PAGE='auth';save();render();toast('Signed out of local preview');break;
case 'reset-demo':{const ok=window.confirm('Reset local KaziTasks demo data? This does not affect your real account.');if(ok){DB=seed();PAGE='home';MODAL=null;save();render();toast('Demo reset to sample data')}break}
case 'plan':DB.subscription=val;save();render();toast(`Switched to ${val} preview — no purchase made`);break;
case 'call':toast('Calling is not available in the offline preview');break;
case 'attach-chat':document.getElementById('chatfile')?.click();break;
case 'appointment':openModal('appointment');break;
default:toast('Preview action not available')}
}
document.addEventListener('click',e=>{if(e.target?.id==='backdrop'){closeModal();return}const el=e.target.closest('[data-action],[data-route]');if(!el)return;e.preventDefault();const route=el.dataset.route;if(route){if(route==='post'&&DB.role==='client')POSTSTEP=1;go(route);return}doAction(el.dataset.action,el)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.change==='lang'){DB.lang=el.value;save();render();toast('Language changed; secondary demo content may use English fallback')}if(el.id==='project-file'){const fb=document.getElementById('file-feedback');if(fb)fb.textContent=el.files[0]?`Selected: ${el.files[0].name} (local only)`:''}if(el.id==='chatfile'&&el.files[0])toast('Selected '+el.files[0].name+' — not uploaded')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL)closeModal();if(e.key==='Enter'&&e.target.id==='searchbox'){e.preventDefault();doAction('search',e.target)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='apply-form'){const j=idJob(MODAL.id);if(!j||j.status!=='open'){toast('Job not open');return}if(DB.profile<40){toast('Profile must reach at least 40%');return}if(DB.applications.some(a=>a.job===j.id&&a.tasker==='Alex')){toast('Already applied');return}DB.applications.unshift({id:'AP-'+Date.now(),job:j.id,tasker:'Alex',bid:Number(fd.get('bid')),note:String(fd.get('note')).slice(0,400),status:'pending'});notify('client','New application',`Alex applied for ${j.title}`,'applications');save();MODAL=null;go('applications');toast('Application submitted in demo')}else if(f.id==='offer-form'){const m=MODAL,p=idTasker(m.id),old=DB.offers.find(o=>o.id===m.offerId);if(old){old.price=Number(fd.get('price'));old.job=String(fd.get('job'));old.note=String(fd.get('note'));notify('tasker','Offer updated','An offer was edited by the Client','offers')}else{DB.offers.unshift({id:'OF-'+Date.now(),job:String(fd.get('job')),tasker:p?.name||'David Musoke',price:Number(fd.get('price')),note:String(fd.get('note')),status:'pending'});notify('tasker','New job offer',`You received an offer from ${DB.clientName}`,'offers')}save();MODAL=null;go('offers');toast(old?'Pending offer updated':'Offer sent in demo')}else if(f.id==='topup-form'){const amount=Number(fd.get('amount'));if(amount<1000||amount>100000000){toast('Choose an amount above UGX 1,000');return}DB.wallets[DB.role]+=amount;const x=transaction('Funds added',amount,String(fd.get('method')),'Demo wallet top-up');MODAL=null;save();go('receipt',x.id);toast('Demo wallet updated — no real money moved')}else if(f.id==='withdraw-form'){const amt=Number(fd.get('amount'));if(String(fd.get('pin'))!=='2468'){toast('Incorrect demo PIN. Use 2468.');return}if(amt<1000||amt>DB.wallets[DB.role]){toast('Amount exceeds available demo balance');return}DB.wallets[DB.role]-=amt;const x=transaction('Wallet withdrawal',-amt,'Demo Mobile Money','Sample withdrawal');MODAL=null;save();go('receipt',x.id);toast('Demo withdrawal recorded — no money sent')}else if(f.id==='pin-form'){if(String(fd.get('pin'))!=='2468'){toast('For the demo, use 2468');return}DB.pinSet=true;save();MODAL=null;go('wallet');toast('Demo PIN preview enabled')}else if(f.id==='forgot-form'){const email=String(fd.get('email'));MODAL=null;render();toast(`Reset request illustrated for ${email}; no email was sent`)}else if(f.id==='signup-form'){const name=String(fd.get('name')).trim(),role=String(fd.get('role'));if(!name){toast('Enter a name');return}DB[role==='client'?'clientName':'taskerName']=name;DB.role=role;DB.signed=true;MODAL=null;save();go('home');toast('Demo account created locally; no real registration')}else if(f.id==='profile-form'){DB[DB.role==='client'?'clientName':'taskerName']=String(fd.get('name')).trim();DB.profile=Number(fd.get('completion'));MODAL=null;save();go('account');toast('Profile updated locally')}else if(f.id==='appointment-form'){const when=String(fd.get('when')),note=String(fd.get('note'));notify(DB.role,'Discussion scheduled',`${when} ${note}`,'notifications');MODAL=null;save();go('notifications');toast('Demo reminder saved')}else if(f.id==='chat-form'){const body=String(fd.get('message')||'').trim();if(!body)return;const peer=DETAIL||'Sarah Nakato';DB.messages.push({id:Date.now(),peer,role:DB.role,body:body.slice(0,600),mine:true,time:new Date().toLocaleTimeString('en-UG',{hour:'2-digit',minute:'2-digit'})});notify(DB.role==='client'?'tasker':'client','New message',`${DB.role==='client'?DB.clientName:DB.taskerName}: ${body.slice(0,45)}`,'chats');save();render();toast('Demo message saved locally')}});
ensureChatRooms();render();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
}</script></body></html>
